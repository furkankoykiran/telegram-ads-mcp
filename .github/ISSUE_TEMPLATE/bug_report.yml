name: Bug report
description: Report a reproducible problem with the server, CLI or tools.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not include your API token, account IDs,
        phone numbers or customer data. For security issues, use the private process in
        [SECURITY.md](https://github.com/furkankoykiran/telegram-ads-mcp/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest steps, tool call or script that reproduces the issue. Redact secrets.
      placeholder: |
        1. Run `telegram-ads-mcp doctor`
        2. Call `tg_get_account`
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, JSON output or logs. Remove tokens and personal data.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `telegram-ads-mcp --version`.
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Cursor
        - Codex
        - OpenCode
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Server mode
      options:
        - read-only
        - write
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed tokens, account IDs and personal data from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
