name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current package version to npm
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package
        run: npm pack --dry-run

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const version = require("./package.json").version;
            const tag = process.env.GITHUB_REF_NAME;
            if (`v${version}` !== tag) {
              console.error(`Tag ${tag} does not match package version v${version}`);
              process.exit(1);
            }
          '

      - name: Verify registry metadata matches package
        run: |
          node -e '
            const pkg = require("./package.json");
            const server = require("./server.json");
            const packageEntry = server.packages?.[0];
            if (server.name !== pkg.mcpName) {
              console.error(`server.json name ${server.name} does not match mcpName ${pkg.mcpName}`);
              process.exit(1);
            }
            if (server.version !== pkg.version || packageEntry?.version !== pkg.version) {
              console.error(`server.json versions must match package version ${pkg.version}`);
              process.exit(1);
            }
          '

      # The first publish needs an NPM_TOKEN secret with publish access. Once the
      # package exists, configure a trusted publisher on npmjs.com for this
      # repository and release.yml, then remove NODE_AUTH_TOKEN to publish via OIDC.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "telegram-ads-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "telegram-ads-mcp@${VERSION} already exists; skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 60); do
            if npm view "telegram-ads-mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "telegram-ads-mcp@${VERSION} is available"
              exit 0
            fi
            echo "Waiting for telegram-ads-mcp@${VERSION} (attempt ${attempt}/60)"
            sleep 6
          done
          echo "npm package did not become available in time" >&2
          exit 1

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher publish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
